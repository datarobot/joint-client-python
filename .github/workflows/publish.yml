name: Publish to PyPI

on:
    push:
        tags:
            - "v*"

concurrency:
    group: publish-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    build:
        name: Build distribution
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Install Task
              uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install uv with cache
              uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              with:
                  version: "0.10.12"
                  python-version: "3.13.3"
                  enable-cache: true
                  cache-dependency-glob: |
                      uv.lock
                      pyproject.toml

            - name: Sync project dependencies
              run: uv sync --all-groups --extra notebooks

            - name: Build and validate distribution
              run: task build

            - name: Upload distribution artifacts
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: python-package-distributions
                  path: dist/

    publish:
        name: Publish to PyPI
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment:
            name: pypi
            url: https://pypi.org/p/jointfm-client
        permissions:
            # Trusted publishing (OIDC) needs a short-lived token; no API token secret required.
            id-token: write
        steps:
            - name: Download distribution artifacts
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: python-package-distributions
                  path: dist/

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
